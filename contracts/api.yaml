openapi: 3.1.0
info:
  title: UrbanSense Incident API
  version: 0.1.0
  description: Shared HTTP contract for published UrbanSense incidents. Implementation is intentionally deferred.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
  /incidents:
    get:
      summary: List dashboard-visible pothole incidents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [published, resolved]
      responses:
        '200':
          description: Incident collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
  /incidents/{incident_id}:
    get:
      summary: Get one pothole incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          description: Incident not found
  /ws/incidents:
    get:
      summary: WebSocket endpoint for newly published or updated incidents
      description: Upgrade this endpoint to WebSocket. Each message is one Incident object.
      responses:
        '101':
          description: Switching Protocols
components:
  parameters:
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Incident:
      $ref: ./incident.schema.json
